repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  # The hook already selects Python by type; the previous `^generator/` filter
  # only meant that each new Python directory arrived unlinted and stayed that
  # way until someone noticed.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.12
    hooks:
      # One lockfile at the workspace root covers the generator member too.
      - id: uv-lock
        files: ^(generator/)?(pyproject\.toml|uv\.lock)$
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.42.0
    hooks:
      - id: typos
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  # The composite actions' shared step bodies live in standalone scripts
  # (shared/steps/, proxy/, generator/src/tend/templates/, .config/codex-cloud/)
  # rather than inline `run:` blocks, so actionlint's built-in shellcheck
  # doesn't see them. Run shellcheck directly to keep that coverage. -S warning
  # matches actionlint's default severity.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-S", "warning"]
        files: ^(shared/steps/.*\.sh|generator/src/tend/templates/.*\.sh|proxy/setup-sandbox\.sh|plugins/.*\.sh|\.config/codex-cloud/environment\.sh)$
  - repo: local
    hooks:
      # The Claude Code slash-command preprocessor treats a backticked token
      # beginning with an exclamation mark as shell command substitution. Any
      # plugin skill file loaded by /review (or another slash command) that
      # contains this sequence crashes the session before any assistant turn
      # runs. Regressed twice already: #217 introduced, #234 fixed, #226
      # reintroduced, #243 fixed again. This guard rejects a third regression
      # at commit time. The check uses chr(33)+chr(96) so the script itself
      # is safe from the pattern it is searching for.
      - id: no-preprocessor-poison-in-skills
        name: forbid bang-backtick in plugin skill files
        language: system
        entry: python3
        args:
          - -c
          - |
            import pathlib, sys
            poison = chr(33) + chr(96)
            hits = [
                (str(p), i, line)
                for p in pathlib.Path("plugins").rglob("*.md")
                for i, line in enumerate(p.read_text().splitlines(), start=1)
                if poison in line
            ]
            for p, i, line in hits:
                print(f"{p}:{i}: {line}")
            if hits:
                print(
                    "\nERROR: bang-backtick sequence in plugin skill file. "
                    "The Claude Code slash-command preprocessor treats this "
                    "as command substitution and crashes the session. "
                    "See max-sixty/tend#234, #243, #244."
                )
                sys.exit(1)
        pass_filenames: false

      # install-tend ships from the marketplace into other repos, so its
      # skill cannot reference repo-internal paths like docs/. Files an
      # installing agent needs are mirrored into the skill's references/
      # dir, which ships inside the plugin subtree. This hook keeps the
      # mirror byte-identical to its canonical source and fails the commit
      # if it drifted (re-stage the synced file).
      - id: sync-install-tend-references
        name: sync install-tend references/ from canonical sources
        language: system
        entry: python3
        args:
          - -c
          - |
            import pathlib, sys

            refs = pathlib.Path(
                "plugins/install-tend/skills/install-tend/references"
            )
            # canonical source -> shipped mirror
            mirrors = {
                pathlib.Path("docs/tend.example.yaml"): refs / "tend.example.yaml",
            }
            stale = []
            for src, dst in mirrors.items():
                if not src.exists():
                    print(
                        f"ERROR: canonical source {src} is missing. A mirror "
                        "in install-tend references/ points at it; update the "
                        "sync-install-tend-references hook if the path moved."
                    )
                    sys.exit(1)
                want = src.read_text()
                if not dst.exists() or dst.read_text() != want:
                    dst.write_text(want)
                    stale.append(f"{dst} (synced from {src})")
            if stale:
                print("Updated install-tend mirrors; re-stage them:")
                for s in stale:
                    print(f"  {s}")
                sys.exit(1)
        pass_filenames: false

      # The set of env names an adopter's `sandbox_env:` may NOT set lives in
      # two places: RESERVED_SANDBOX_ENV in generator/src/tend/config.py (fails
      # at `init`) and the `case "$name"` guard in proxy/setup-sandbox.sh
      # (re-checks a hand-edited workflow). The shell re-check is the actual
      # security boundary; if it drifts below the config set, an adopter's
      # sandbox_env can override a routing/credential var past it. Kept in sync
      # by comments alone this rots — this guard fails the commit if the two
      # sets diverge.
      - id: sandbox-env-reserved-parity
        name: reserved sandbox_env set stays in sync
        language: system
        files: ^(generator/src/tend/config\.py|proxy/setup-sandbox\.sh|docs/tend\.example\.yaml)$
        entry: python3
        args:
          - -c
          - |
            import re, sys

            py = open("generator/src/tend/config.py").read()
            block = re.search(r"RESERVED_SANDBOX_ENV = \{(.*?)\}", py, re.S).group(1)
            config_set = set(re.findall(r'"([^"]+)"', block))

            sh = open("proxy/setup-sandbox.sh").read()
            case = re.search(r'case "\$name" in\s*(.*?)\)', sh, re.S).group(1)
            case = case.replace("\\\n", "").replace("\n", "")
            shell_set = {n.strip() for n in case.split("|") if n.strip()}

            # The invariant that matters: every key written to AGENT_ENV_FILE is
            # reserved, so an adopter's sandbox_env can't shadow it. Extract the
            # heredoc keys and the ${ANTHROPIC_DUMMY} scheme keys (either arm may
            # be written at runtime) and assert they're a subset of the reserved
            # set — so a future routing/cred var added to the heredoc without
            # updating the reserved set fails the commit.
            heredoc = re.search(r'cat >"\$AGENT_ENV_FILE" <<EOF\n(.*?)\nEOF', sh, re.S).group(1)
            heredoc_keys = set(re.findall(r'^([A-Za-z_][A-Za-z0-9_]*)=', heredoc, re.M))
            heredoc_keys |= set(re.findall(r'ANTHROPIC_DUMMY="([A-Za-z_][A-Za-z0-9_]*)=', sh))

            # The adopter only meets this set as a rejection at `init`, so the
            # `sandbox_env` docs have to name every member — a key reserved in
            # code but absent from the docs reads as settable right up until
            # the run fails. Scope the search to that bullet: file-wide, an
            # unrelated mention elsewhere (the auth section names
            # ANTHROPIC_API_KEY and CLAUDE_CODE_OAUTH_TOKEN) would stand in for
            # the list entry and hide the drift this leg exists to catch.
            docs = open("docs/tend.example.yaml").read()
            section = re.search(r"^# - `sandbox_env`:(.*?)^# - `", docs, re.S | re.M).group(1)
            documented = set(re.findall(r"`([A-Za-z_][A-Za-z0-9_]*)`", section))

            problems = []
            for name in sorted(config_set - shell_set):
                problems.append(f"'{name}' is reserved in config.py but NOT guarded in setup-sandbox.sh")
            for name in sorted(shell_set - config_set):
                problems.append(f"'{name}' is guarded in setup-sandbox.sh but NOT reserved in config.py")
            for name in sorted(heredoc_keys - config_set):
                problems.append(f"'{name}' is written to AGENT_ENV_FILE but NOT reserved in config.py — an adopter's sandbox_env could shadow it")
            for name in sorted(config_set - documented):
                problems.append(f"'{name}' is reserved in config.py but NOT named in docs/tend.example.yaml's sandbox_env list")

            for p in problems:
                print(p)
            if problems:
                print(
                    "\nERROR: the reserved sandbox_env set drifted between "
                    "config.py, setup-sandbox.sh, the AGENT_ENV_FILE heredoc, "
                    "and docs/tend.example.yaml. The shell case is the security "
                    "boundary; keep every env-file key reserved, the two sets "
                    "aligned, and every reserved name documented."
                )
                sys.exit(1)
        pass_filenames: false
