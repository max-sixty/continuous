name: Tend (Codex, experimental)
description: >-
  Experimental Codex harness for Tend, an autonomous junior maintainer for
  GitHub repos. Authenticate via OPENAI_API_KEY.

inputs:
  github_token:
    required: true
    description: GitHub token for API access and pushing commits
  openai_api_key:
    required: true
    description: >-
      OpenAI API key for the Responses API, billed per token. The
      subscription `auth.json` path is not supported — Codex rotates
      that refresh token on every API call and invalidates the prior
      one, so concurrent jobs (review/mention/triage/nightly/…) would
      break each other's auth mid-run.
  bot_name:
    required: true
    description: |
      GitHub username of the bot account. Rendered into the workflows so an
      adopter can see which account tend runs as; the steps themselves read
      the identity off the token rather than from here, since a name left
      stale by a rename fails open.
  prompt:
    required: true
    description: >-
      The prompt to send to Codex. The tend-ci-runner plugin is installed
      before invocation, so `$skill-name` mentions resolve to the
      corresponding SKILL.md (e.g. `$review`, `$triage`).
  model:
    default: gpt-5.5
    description: >-
      Codex model to use. Current visible models per Codex's model cache:
      gpt-5.5 (default, top tier), gpt-5.4, gpt-5.4-mini, gpt-5.3-codex,
      gpt-5.2.
  effort:
    default: ""
    description: >-
      Reasoning effort — low, medium, high, or xhigh. Empty means leave
      at Codex CLI default (medium for gpt-5.5).
  args:
    default: ""
    description: >-
      Additional Codex CLI arguments, one exact argument per line. They are
      passed before Tend's managed arguments; Codex validates conflicts.
  sandbox:
    # Restricted modes cannot currently initialize bubblewrap's loopback
    # network on the standard GitHub-hosted Ubuntu 24.04 runner. Tend defaults
    # to full local execution inside that ephemeral runner; the separate UID
    # and credential proxies below remain the credential boundary.
    default: danger-full-access
    description: >-
      Codex sandbox mode. Restricted modes require a compatible Linux runner;
      GitHub-hosted Ubuntu 24.04 currently requires danger-full-access.
  codex_version:
    default: "0.151.0"
    description: >-
      `@openai/codex` npm version to install. Must ship
      the `codex plugin add` subcommand (PR #21396, first released in
      `rust-v0.131.0-alpha.17`). That was `alpha`-only when the pin was
      first set; stable carries it now, so this tracks `latest`. CI's
      `test-codex-surface` job confirms whichever version is pinned.
  mitmproxy_version:
    default: "12.2.3"
    description: >-
      Pinned mitmproxy version for the credential-injection proxy.
  uv_version:
    default: "0.12.10"
    description: >-
      Pinned fallback `uv` version. The agent PATH appends it after any
      adopter-provided version.
  sandbox_path:
    default: ""
    description: >-
      Newline-separated directories prepended to the sandbox agent's PATH.
  sandbox_env:
    default: ""
    description: >-
      Newline-separated NAME=VALUE pairs added to the sandbox agent's launch
      environment. Credential and proxy-routing names are reserved.
  sandbox_setup:
    default: ""
    description: >-
      Shell commands run as the sandbox user after tools and plugins install.
  allowed_bots:
    default: "*"
    description: Bots allowed to trigger workflows (engagement gate, not used yet)
  allowed_non_write_users:
    default: "*"
    description: Non-write users allowed to trigger workflows (engagement gate, not used yet)

outputs:
  token_usage:
    description: >-
      JSON object with token usage parsed from the Codex rollout JSONL:
      input_tokens, output_tokens, cached_input_tokens, model, cost_usd.
      cost_usd is 0 — Codex CLI doesn't surface API list prices. The record
      also names the run it came from: repo, workflow, run_id, run_attempt,
      event, number (the PR or issue, null when the trigger has no thread),
      and head_sha.
    value: ${{ steps.tokens.outputs.usage }}
  final_message:
    description: >-
      The final assistant message Codex wrote (markdown), base64-encoded.
      Decode with `base64 -d` before use. Encoded so arbitrary agent
      content can't break the $GITHUB_OUTPUT framing.
    value: ${{ steps.codex.outputs.final_message }}

runs:
  using: composite
  steps:
    # Preflight/teardown step bodies are shared with the Claude actions via
    # ../shared/steps; codex's auth, prompt staging, and run path are its own.
    - name: Security preflight
      id: security
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/security_preflight.py"
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}

    # Also publishes `login`/`id` for the bot: it reads them off the token it
    # already holds, so nothing downstream has to resolve them again from the
    # configured name, which a rename would leave stale.
    - name: Rate limit preflight
      id: bot
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/rate_limit_preflight.py"
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Install proxy uv
      shell: bash
      run: bash "${{ github.action_path }}/../shared/steps/install-uv.sh"
      env:
        UV_VERSION: ${{ inputs.uv_version }}
        UV_INSTALL_DIR: ${{ runner.temp }}/tend-uv

    # Install the Codex CLI from npm. `@openai/codex` ships a prebuilt
    # per-platform binary, so this is ~3 s with no Rust toolchain. We pin
    # an explicit version (`codex_version`) rather than floating on
    # `latest` so an adopter's run can't change engine mid-release. The
    # pin sat on an `alpha` for a while because only prereleases carried
    # `codex plugin add` (PR #21396, first in `rust-v0.131.0-alpha.17`);
    # stable ships it now, so the pin tracks `latest` and drops back to a
    # prerelease only for a fix that hasn't been released yet.
    - name: Install Codex and Responses proxy
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex_version }}
      run: |
        npm install -g \
          "@openai/codex@$CODEX_VERSION" \
          "@openai/codex-responses-api-proxy@$CODEX_VERSION"
        NODE_BIN=$(command -v node)
        CODEX_BIN=$(command -v codex)
        CODEX_PROXY_BIN=$(command -v codex-responses-api-proxy)
        "$CODEX_BIN" --version
        {
          echo "NODE_BIN=$NODE_BIN"
          echo "CODEX_BIN=$CODEX_BIN"
          echo "CODEX_PROXY_BIN=$CODEX_PROXY_BIN"
        } >> "$GITHUB_ENV"

    # Restore PR-authored startup config before the credential handoff. This
    # needs the git credential actions/checkout persisted; setup_sandbox.py
    # removes it from disk.
    - name: Restore sensitive config from base branch (PRs)
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/bash "${{ github.action_path }}/../shared/steps/restore-sensitive-config.sh"
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Cache mitmproxy
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/tend-mitmproxy-uv
        key: tend-mitmproxy-${{ runner.os }}-${{ inputs.mitmproxy_version }}

    # The runner-owned proxy retains the real GitHub credential. Codex runs
    # under a separate non-sudo UID with a dummy token; the proxy replaces it
    # only for exact GitHub hosts. OpenAI authentication gets its own narrower
    # upstream proxy in the next step.
    - name: Set up credential-isolation sandbox
      # Resolve the interpreter and credential holder outside the adopter's
      # environment: this step is the only one that receives the real PAT.
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        BASH_ENV: ""
        BASHOPTS: ""
        SHELLOPTS: ""
        PS4: ""
        TEND_GH_TOKEN: ${{ inputs.github_token }}
        TEND_GITHUB_ONLY: "1"
        ACTION_PATH: ${{ github.action_path }}/..
        MITMPROXY_VERSION: ${{ inputs.mitmproxy_version }}
        TEND_UV_DIR: ${{ runner.temp }}/tend-uv
        UV_CACHE_DIR: ${{ runner.temp }}/tend-mitmproxy-uv
        TEND_SANDBOX_PATH: ${{ inputs.sandbox_path }}
        TEND_SANDBOX_ENV: ${{ inputs.sandbox_env }}
      run: |
        set +x
        /usr/bin/env -i \
          TEND_RUNNER_TOOL_PATH="$PATH" \
          PATH=/usr/sbin:/usr/bin:/sbin:/bin \
          HOME="$RUNNER_TEMP" \
          LANG=C.UTF-8 \
          GITHUB_ENV="$GITHUB_ENV" \
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
          RUNNER_TEMP="$RUNNER_TEMP" \
          TEND_GH_TOKEN="$TEND_GH_TOKEN" \
          TEND_GITHUB_ONLY="$TEND_GITHUB_ONLY" \
          ACTION_PATH="$ACTION_PATH" \
          MITMPROXY_VERSION="$MITMPROXY_VERSION" \
          TEND_UV_DIR="$TEND_UV_DIR" \
          UV_CACHE_DIR="$UV_CACHE_DIR" \
          UV_NO_CONFIG=1 \
          PYTHONNOUSERSITE=1 \
          TEND_SANDBOX_PATH="$TEND_SANDBOX_PATH" \
          TEND_SANDBOX_ENV="$TEND_SANDBOX_ENV" \
          "${TEND_UV_DIR}/uv" run --no-cache --no-config \
            --no-python-downloads --python /usr/bin/python3 --script \
            "${{ github.action_path }}/../proxy/setup_sandbox.py"

    # OpenAI's proxy forwards only POST /v1/responses upstream, reads the key
    # from stdin, removes it from its process environment, and hardens the
    # memory that retains it. Its loopback GET /shutdown exists for teardown.
    - name: Start OpenAI Responses proxy
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        BASH_ENV: ""
        BASHOPTS: ""
        SHELLOPTS: ""
        PS4: ""
        PROXY_API_KEY: ${{ inputs.openai_api_key }}
      run: |
        set +x
        PATH=/usr/sbin:/usr/bin:/sbin:/bin
        SERVER_INFO_FILE="$RUNNER_TEMP/tend-codex-proxy.json"
        PROXY_LOG_FILE="$RUNNER_TEMP/tend-codex-proxy.log"
        rm -f -- "$SERVER_INFO_FILE" "$PROXY_LOG_FILE"
        if [ -z "$PROXY_API_KEY" ]; then
          echo "::error::OPENAI_API_KEY is unset. Set the OPENAI_API_KEY repo secret."
          exit 1
        fi
        (
          exec /usr/bin/env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            NODE_OPTIONS=--disable-sigusr1 \
            "$NODE_BIN" "$CODEX_PROXY_BIN" \
            --http-shutdown \
            --server-info "$SERVER_INFO_FILE" <<< "$PROXY_API_KEY"
        ) > "$PROXY_LOG_FILE" 2>&1 &
        for _ in {1..10}; do
          [ -s "$SERVER_INFO_FILE" ] && break
          sleep 1
        done
        if [ ! -s "$SERVER_INFO_FILE" ]; then
          cat "$PROXY_LOG_FILE" >&2 || true
          echo "::error::OpenAI Responses proxy did not start"
          exit 1
        fi
        PROXY_PORT=$(/usr/bin/python3 -E -s -c \
          'import json,sys; print(json.load(open(sys.argv[1]))["port"])' \
          "$SERVER_INFO_FILE")
        sudo chmod 444 "$SERVER_INFO_FILE"
        sudo chown root:root "$SERVER_INFO_FILE"
        echo "CODEX_PROXY_URL=http://127.0.0.1:$PROXY_PORT" >> "$GITHUB_ENV"

    - name: Verify codex is reachable from the sandbox
      shell: bash
      run: |
        mapfile -t AGENT_ENV < "$AGENT_ENV_FILE"
        sudo -u "$SANDBOX" env "${AGENT_ENV[@]}" codex --version

    - name: Install agent uv fallback (sandbox)
      shell: bash
      env:
        UV_VERSION: ${{ inputs.uv_version }}
      run: |
        sudo -u "$SANDBOX" env \
          HOME="$AGENT_HOME" PATH=/usr/bin:/bin \
          UV_VERSION="$UV_VERSION" UV_INSTALL_DIR="$TEND_AGENT_UV_DIR" \
          /usr/bin/bash "${{ github.action_path }}/../shared/steps/install-uv.sh"

    # Install the tend-ci-runner plugin from the action's own checkout.
    # `github.action_path` is .../<runner-cache>/max-sixty/tend/<ref>/codex/;
    # the marketplace manifest at .agents/plugins/marketplace.json (one level
    # up) registers tend-ci-runner as a local-source plugin. We copy both trees
    # into the sandbox home so the sandbox UID can read them, register that
    # marketplace, then `codex plugin add` installs the plugin so its skills
    # become discoverable by `codex exec`.
    #
    # We export `CLAUDE_PLUGIN_ROOT` to the install location so skills can
    # resolve `${CLAUDE_PLUGIN_ROOT}/scripts/...` paths. Claude Code reaches the
    # same place by a different route — it text-substitutes the variable into
    # bundled plugin skill markdown at load time rather than setting it in the
    # shell, so under Claude the literal resolves only inside a bundled skill.
    # One variable name across harnesses — skills stay harness-agnostic.
    - name: Install tend-ci-runner plugin (sandbox)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: /usr/bin/python3 -E -s "${{ github.action_path }}/runner.py" install-plugin

    - name: Stage AGENTS.md (sandbox)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BOT_NAME: ${{ steps.bot.outputs.login }}
      run: /usr/bin/python3 -E -s "${{ github.action_path }}/runner.py" stage-agents

    - name: Run adopter sandbox setup
      shell: bash
      run: /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/sandbox_setup.py"
      env:
        TEND_SANDBOX_SETUP: ${{ inputs.sandbox_setup }}

    - name: Run Codex
      id: codex
      shell: bash
      env:
        BOT_NAME: ${{ steps.bot.outputs.login }}
        BOT_ID: ${{ steps.bot.outputs.id }}
        PROMPT: ${{ inputs.prompt }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        EXTRA_ARGS: ${{ inputs.args }}
        CODEX_SANDBOX_MODE: ${{ inputs.sandbox }}
      # runner.py preserves the final message even when codex exits non-zero.
      # Base64 keeps arbitrary agent output in one GITHUB_OUTPUT line; consumers
      # decode it with `base64 -d`.
      run: /usr/bin/python3 -E -s "${{ github.action_path }}/runner.py" run

    # Stop every process owned by the sandbox before any runner-owned step
    # reads agent-controlled paths, then restore checkout ownership.
    - name: Reap sandbox and restore workspace ownership
      if: always()
      id: sandbox_reap
      shell: bash
      run: |
        if [ -n "${SANDBOX:-}" ]; then
          sudo pkill -KILL -u "$SANDBOX" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
        fi
        if [ -n "${CODEX_PROXY_URL:-}" ]; then
          curl --fail --silent --show-error "$CODEX_PROXY_URL/shutdown" || true
        fi
        echo "sandbox_reaped=true" >> "$GITHUB_OUTPUT"

    - name: Append skill step summary
      if: always()
      shell: bash
      run: |
        if [ -f /tmp/claude/step-summary.md ]; then
          sudo -u "$SANDBOX" cat /tmp/claude/step-summary.md \
            | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null
          echo >> "$GITHUB_STEP_SUMMARY"
        fi

    # Codex writes rollouts under the sandbox user's ~/.codex/sessions. The
    # step consolidates them into a runner-owned directory only after reaping
    # the sandbox and drops every symlink before artifact upload.
    # Each event includes a token_count field (input/output/cached). Sum
    # them. Cost is left at 0 — Codex CLI doesn't surface API list prices
    # and computing them ourselves would require maintaining a price table.
    # Shares shared/steps/token_usage.py with the Claude harness, which is
    # what keeps the record's shape and the summary table's shell the same
    # across harnesses; the rows and the parsers differ per `--harness`.
    - name: Token usage
      if: always()
      id: tokens
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        SANDBOX_REAPED: ${{ steps.sandbox_reap.outputs.sandbox_reaped }}
      run: /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/token_usage.py" --harness codex

    - name: Mark event notification read
      if: success()
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/mark_notification_read.py"
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}

    # Gate on the job being red, not on the agent step specifically — see the
    # matching note in claude/action.yaml, including why the security preflight
    # is excluded. Every step ahead of `codex` (the rate-limit preflight, bot-ID
    # resolution, the CLI and proxy installs, the sandbox handoff, the AGENTS.md
    # staging, and PR config restoration) strands the same work when it fails, and
    # keying on `steps.codex.outcome` kept all of them out of the outage
    # tracker.
    - name: Report failure
      if: failure() && steps.security.outcome != 'failure'
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/report_failure.py"
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Compute artifact name
      if: always()
      id: artifact
      shell: bash
      run: |
        suffix="${INVOCATION_ID:+"-${INVOCATION_ID:0:8}"}"
        echo "name=codex-session-logs${suffix}" >> "$GITHUB_OUTPUT"

    - name: Upload session logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ runner.temp }}/tend-codex-logs/
        retention-days: 30
        if-no-files-found: warn
