name: integration-secrets

# Reseeds the weekly integration-test fixture's secrets
# (tend-agent/tend-integration) from this repo's secrets.
#
# This cannot happen inside the weekly agent run: the interactive
# harness sandboxes the agent behind a credential-injecting proxy, so
# the agent's env holds a placeholder GitHub token and no Anthropic
# credential. Anything the agent exports (e.g. `gh secret set` into
# the fixture) stores the placeholder, not the real value. This
# workflow runs outside that sandbox, where `secrets.*` are real.
#
# The weekly integration-test recipe
# (.claude/skills/running-tend/references/integration-test.md, §1)
# dispatches it before driving the fixture; dispatch it manually after
# rotating either secret:
#   gh workflow run integration-secrets --repo max-sixty/tend

on:
  workflow_dispatch:

permissions: {}

jobs:
  reseed:
    if: github.repository_owner == 'max-sixty'
    runs-on: ubuntu-24.04
    # The source secrets live in this repo's `tend` environment; a manual
    # dispatch runs on the default branch, which its policy admits.
    environment: tend
    steps:
      - name: Reseed tend-agent/tend-integration secrets
        # The bot PAT plays both roles: it authenticates the `gh secret
        # set` calls (the bot owns the fixture repo, so it has admin
        # there) and is itself the value stored as TEND_BOT_TOKEN.
        env:
          GH_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # `gh secret set` accepts an empty body, so an unset source
          # secret would silently clobber the fixture. Fail fast instead.
          [ -n "$GH_TOKEN" ] || { echo "TEND_BOT_TOKEN is empty" >&2; exit 1; }
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "CLAUDE_CODE_OAUTH_TOKEN is empty" >&2; exit 1; }

          # The fixture's secrets live in its `tend` environment, mirroring
          # a real install. PUT is create-or-update, so this owns the
          # environment's existence; the policy admits only main, the ref
          # every fixture workflow runs on.
          gh api -X PUT repos/tend-agent/tend-integration/environments/tend \
            --input - <<< '{"deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":true}}'

          # Reconcile to exactly `main`, deleting as well as adding: this
          # environment holds the real bot PAT and OAuth token, and the bot is
          # admin on the fixture, so any other admitted ref is one it can push
          # a workflow to. A ref left by a probe would otherwise survive every
          # reseed with the run reporting success over it.
          # --paginate: an accumulated policy set is exactly the case that can
          # exceed one page, and an unread tail is one this prune would miss
          # while the run reported success.
          POLICIES=$(gh api --paginate \
            repos/tend-agent/tend-integration/environments/tend/deployment-branch-policies \
            --jq '.branch_policies[] | "\(.name) \(.id)"')
          echo "$POLICIES" | awk '$1 != "main" {print $2}' \
            | while read -r id; do
                gh api -X DELETE "repos/tend-agent/tend-integration/environments/tend/deployment-branch-policies/$id"
              done
          echo "$POLICIES" | awk '{print $1}' | grep -qx main \
            || gh api -X POST repos/tend-agent/tend-integration/environments/tend/deployment-branch-policies \
                 -f name=main -f type=branch

          printf '%s' "$GH_TOKEN" \
            | gh secret set TEND_BOT_TOKEN --repo tend-agent/tend-integration --env tend
          printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" \
            | gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo tend-agent/tend-integration --env tend

          # A repo-level copy is readable by any workflow the bot pushes,
          # which is exactly the hole the environment closes — but the
          # fixture's workflows are regenerated by the *published* tend, so
          # they name the environment only a release after the generator
          # does. Delete the copies once they do; until then the fixture
          # would be left with secrets none of its jobs could read.
          if gh api repos/tend-agent/tend-integration/contents/.github/workflows/tend-review.yaml \
               -H "Accept: application/vnd.github.raw" | grep -q 'environment: tend'; then
            for s in TEND_BOT_TOKEN CLAUDE_CODE_OAUTH_TOKEN; do
              gh secret delete "$s" --repo tend-agent/tend-integration 2>/dev/null || true
            done
          else
            echo "Fixture workflows predate the environment gate; keeping repo-level copies until the next regeneration."
          fi
