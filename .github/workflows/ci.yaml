name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every Python test in the repo — pytest collects generator/, proxy/, and the
  # install-tend scripts from the root — in the root workspace's environment,
  # whose dev group holds the pinned mitmproxy the proxy addon imports.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv run pytest
      # pypi-release.yaml only fires on a tag push, and the tag is immutable by
      # ruleset, so a build that breaks there costs a manual publish. Run the
      # same command here, where a bad `uv build` invocation fails on its PR.
      - run: uv build --package tend

  # The addon's pytest suite (in `test` above) exercises `mitmproxy.http` and
  # never launches the proxy, so it passes unchanged across major mitmproxy
  # versions. This job launches it.
  test-proxy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      # mitmdump starts the way setup-sandbox.sh starts it, so a release that
      # drops a flag, moves the CA file, or breaks the addon's import fails
      # here rather than on every adopter's next run. It goes through the
      # pinned uv, which nothing else in CI installs. The --allow-hosts value
      # is a throwaway: setup-sandbox.sh owns the real regex, which must track
      # the allowlists in inject_credentials.py.
      #
      # It installs uv by running install-proxy-uv.sh rather than repeating it,
      # which also gives that script its only CI coverage, then warms the uvx
      # cache as setup-sandbox.sh does so the wait measures startup.
      #
      # Readiness is the port accepting, not the CA file: mitmdump writes the
      # CA before it binds the port and before it loads `-s` scripts, so a port
      # collision or an addon raising on import leaves the CA behind and exits
      # ~0.1s later. Polling the CA and then sampling the process is a race
      # whose outcome depends on how fast the addon imports. Waiting for a
      # connection asserts the proxy is actually serving, needs no tuned
      # settle, and the liveness check inside the loop exits early on death.
      - name: Smoke the pinned uv and mitmdump
        run: |
          uv_v=$(yq -e '.inputs.uv_version.default' ../claude/action.yaml)
          mitm_v=$(yq -e '.inputs.mitmproxy_version.default' ../claude/action.yaml)
          UV_VERSION="$uv_v" TEND_UV_DIR="$RUNNER_TEMP/tend-uv" \
            bash ../shared/steps/install-proxy-uv.sh
          confdir=$RUNNER_TEMP/tend-mitm-conf
          log=$RUNNER_TEMP/tend-mitm.log
          uvx=$RUNNER_TEMP/tend-uv/uvx
          "$uvx" --from "mitmproxy==${mitm_v}" mitmdump --version >/dev/null
          TEND_GH_TOKEN=dummy TEND_ANTHROPIC_OAUTH_TOKEN=dummy \
            "$uvx" --from "mitmproxy==${mitm_v}" mitmdump \
              -s inject_credentials.py \
              --listen-host 127.0.0.1 --listen-port 8081 \
              --set confdir="$confdir" \
              --allow-hosts '^example\.invalid$' >"$log" 2>&1 &
          pid=$!
          ready=
          for _ in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            if (exec 3<>/dev/tcp/127.0.0.1/8081) 2>/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            cat "$log"
            echo "::error::mitmdump never accepted a connection under mitmproxy ${mitm_v}"
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          test -f "$confdir/mitmproxy-ca-cert.pem"

  # These scripts need a second uid, sudo, and a hosted-runner PATH, so exercise
  # them for real. The planted tools cover sibling dependencies, a symlinked
  # SDK root, the checkout, privilege metadata, special files, private/writable
  # refusals, and an /etc/skel collision. The real Rust action guards the
  # nastiest failure: resolving rustc at a different version than CI.
  test-sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Plant runner-home tools
        run: |
          bin="$HOME/.cargo-install/tend-probe/bin"
          relative="$RUNNER_TEMP/tend-node/node_modules"
          sdk="$HOME/.sdkman/candidates/java"
          workspace_bin="$GITHUB_WORKSPACE/.tend-probe/bin"
          mkdir -p "$bin" "$HOME/.local/bin" "$HOME/.local/lib/tend" \
            "$HOME/.cargo/bin" "$relative/.bin" "$relative/tend-relative/bin" \
            "$sdk/17/bin" "$workspace_bin"
          printf '#!/bin/sh\necho probe\n' >"$bin/tend-probe"
          printf '#!/bin/sh\necho private\n' >"$bin/tend-private"
          printf '#!/bin/sh\necho writable\n' >"$bin/tend-writable"
          printf '#!/bin/sh\necho runner-private\n' >"$bin/tend-fallback"
          # shellcheck disable=SC2016
          printf '#!/bin/sh\ncat "$HOME/.local/lib/tend/value"\n' >"$HOME/.local/bin/tend-local"
          printf 'runner-library\n' >"$HOME/.local/lib/tend/value"
          printf '#!/bin/sh\necho pinned\n' >"$HOME/.cargo/bin/tend-pinned"
          printf 'registry-token = "must-not-cross"\n' >"$HOME/.cargo/credentials.toml"
          printf '[registries.private]\ntoken = "must-not-cross"\n' >"$HOME/.cargo/config.toml"
          mkdir -p "$HOME/.local/share/tend-private"
          printf 'must-not-cross\n' >"$HOME/.local/share/tend-private/token"
          chmod 644 "$HOME/.cargo/credentials.toml" "$HOME/.cargo/config.toml" \
            "$HOME/.local/share/tend-private/token"
          printf '#!/bin/sh\necho relative\n' >"$relative/tend-relative/bin/tend-relative"
          ln -s ../tend-relative/bin/tend-relative "$relative/.bin/tend-relative"
          printf '#!/bin/sh\necho alias\n' >"$sdk/17/bin/tend-alias"
          ln -s 17 "$sdk/current"
          printf '#!/bin/sh\necho workspace\n' >"$workspace_bin/tend-workspace"
          printf '#!/bin/sh\necho system-fallback\n' | \
            sudo tee /usr/local/bin/tend-fallback >/dev/null
          cp /bin/true "$bin/tend-setid"
          cp /bin/true "$bin/tend-capability"
          runner_alias="/tmp/tend-runner-home-alias-$GITHUB_RUN_ID"
          inode_alias="/tmp/tend-runner-inode-alias-$GITHUB_RUN_ID"
          ln -s "$bin" "$runner_alias"
          ln -s "$bin/tend-setid" "$inode_alias"
          ln -s "$inode_alias" "$bin/tend-link-bypass"
          mkfifo "$bin/tend-fifo"
          chmod 755 "$bin/tend-probe" "$HOME/.local/bin/tend-local" \
            "$HOME/.cargo/bin/tend-pinned" "$relative/tend-relative/bin/tend-relative" \
            "$sdk/17/bin/tend-alias" "$workspace_bin/tend-workspace" \
            /usr/local/bin/tend-fallback "$bin/tend-capability"
          chmod 700 "$bin/tend-private" "$bin/tend-fallback"
          chmod 777 "$bin/tend-writable"
          chmod 4755 "$bin/tend-setid"
          sudo setcap cap_net_bind_service=ep "$bin/tend-capability"
          {
            echo "$bin"
            echo "$relative/.bin"
            echo "$sdk/current/bin"
            echo "$workspace_bin"
            echo "$runner_alias"
          } >>"$GITHUB_PATH"
          sudo install -d /etc/skel/.cargo/bin
          printf '#!/bin/sh\necho stale\n' | sudo tee /etc/skel/.cargo/bin/tend-pinned >/dev/null
          sudo chmod 755 /etc/skel/.cargo/bin/tend-pinned
      - name: Set up the sandbox
        env:
          TEND_GH_TOKEN: dummy
          TEND_ANTHROPIC_OAUTH_TOKEN: dummy
          ACTION_PATH: ${{ github.workspace }}
          TEND_UV_DIR: ${{ runner.temp }}/tend-uv
          UV_CACHE_DIR: ${{ runner.temp }}/tend-mitmproxy-uv
          # The adopter lever still wins over the automatic mirror.
          TEND_SANDBOX_PATH: "~/.cargo/bin"
        run: |
          set -o pipefail
          MITMPROXY_VERSION=$(yq -e '.inputs.mitmproxy_version.default' claude/action.yaml)
          export MITMPROXY_VERSION
          UV_VERSION=$(yq -e '.inputs.uv_version.default' claude/action.yaml) \
            bash shared/steps/install-proxy-uv.sh
          bash proxy/setup-sandbox.sh | tee "$RUNNER_TEMP/setup.log"
          agent_path=$(sed -n 's/^\[setup-sandbox\] sandbox PATH: //p' "$RUNNER_TEMP/setup.log")
          if [ -z "$agent_path" ]; then
            echo "::error::setup-sandbox.sh logged no sandbox PATH"
            exit 1
          fi
          IFS=: read -ra agent_path_entries <<<"$agent_path"
          for path_entry in "${agent_path_entries[@]}"; do
            case "$path_entry" in
              "$GITHUB_WORKSPACE" | "$GITHUB_WORKSPACE"/*) ;;
              "$HOME" | "$HOME"/*)
                echo "::error::a non-workspace runner-home entry reached the sandbox PATH: $path_entry"
                exit 1
                ;;
            esac
          done
          case "$agent_path" in
            /home/tend-sandbox/.cargo/bin:*) ;;
            *)
              echo "::error::sandbox_path's ~ entry did not expand to the front: $agent_path"
              exit 1
              ;;
          esac
          case ":$agent_path:" in
            *":/tmp/tend-runner-home-alias-$GITHUB_RUN_ID:"*)
              echo "::error::an external alias exposed its runner-home target: $agent_path"
              exit 1
              ;;
          esac
      - name: Verify mirrored tools and boundary
        run: |
          source_bin="$HOME/.cargo-install/tend-probe/bin"
          mapfile -t agent_env <"$AGENT_ENV_FILE"
          sudo -u "$SANDBOX" env "${agent_env[@]}" bash -euc '
            test "$(tend-probe)" = probe
            test "$(tend-local)" = runner-library
            test "$(tend-pinned)" = pinned
            test "$(tend-relative)" = relative
            test "$(tend-alias)" = alias
            test "$(tend-workspace)" = workspace
            test "$(tend-fallback)" = system-fallback
            tend-setid
            tend-capability
            tend-link-bypass
            case "$(rustc --version)" in "rustc 1.85.0 "*) ;; *) exit 1 ;; esac
            test "$(readlink -f "$JAVA_HOME")" = "$1"
            test ! -e ~/.cargo-install/tend-probe/bin/tend-private
            test ! -e ~/.cargo-install/tend-probe/bin/tend-writable
            test ! -e ~/.cargo-install/tend-probe/bin/tend-fifo
            test ! -e ~/.cargo/credentials.toml
            test ! -e ~/.cargo/config.toml
            test ! -e ~/.local/share/tend-private
            test ! -w ~/.cargo-install/tend-probe/bin/tend-probe
            for command in tend-setid tend-capability; do
              mode=$(stat -c %a ~/.cargo-install/tend-probe/bin/$command)
              test $((8#$mode & 06000)) -eq 0
            done
          ' _ "$(readlink -f "$JAVA_HOME")"
          if test "$source_bin/tend-probe" -ef \
              /home/tend-sandbox/.cargo-install/tend-probe/bin/tend-probe; then
            echo "::error::the sandbox tool still shares the runner's inode"
            exit 1
          fi
          if test "$source_bin/tend-setid" -ef \
              /home/tend-sandbox/.cargo-install/tend-probe/bin/tend-link-bypass; then
            echo "::error::a copied symlink still reaches its runner-owned inode"
            exit 1
          fi
          test -n "$(getcap "$source_bin/tend-capability")"
          test -z "$(getcap /home/tend-sandbox/.cargo-install/tend-probe/bin/tend-capability)"
          grep -q "runner-selected commands not mirrored into sandbox: .*tend-fallback" \
            "$RUNNER_TEMP/setup.log"

          # Refused files remain visible in the diagnostic; successfully
          # mirrored commands do not.
          set -o pipefail
          bash shared/steps/sandbox-setup.sh | tee "$RUNNER_TEMP/report.log"
          report=$(grep "not the agent's:" "$RUNNER_TEMP/report.log" || true)
          case "$report" in
            *tend-private*tend-writable*) ;;
            *) echo "::error::the report did not name both refused tools: $report"; exit 1 ;;
          esac
          case "$report" in
            *tend-probe* | *tend-local* | *tend-pinned* | *" git "*)
              echo "::error::the report named a reachable command: $report"
              exit 1
              ;;
          esac
      # And the lever closes an intentional mirror refusal. Reinstall rather
      # than copy: the runner source is private by definition.
      - name: sandbox_setup closes the private-tool gap
        env:
          TEND_SANDBOX_SETUP: |
            printf '#!/bin/sh\necho private\n' >~/.local/bin/tend-private
            chmod +x ~/.local/bin/tend-private
            tend-private
        run: |
          set -o pipefail
          bash shared/steps/sandbox-setup.sh | tee "$RUNNER_TEMP/report-after.log"
          if grep "not the agent's:" "$RUNNER_TEMP/report-after.log" | grep -q tend-private; then
            echo "::error::still unreachable after sandbox_setup installed it"
            exit 1
          fi
      # The refusal path, which is the security-relevant half of the lever: a
      # runner-home entry would put the credential-holding home on the agent's
      # PATH, and adopter entries are the only input that never passes through
      # the rewrite. It exits before the workspace chown, so re-running the
      # script here disturbs nothing the steps above set up.
      - name: A runner-home sandbox_path entry is refused
        env:
          TEND_GH_TOKEN: dummy
          TEND_ANTHROPIC_OAUTH_TOKEN: dummy
          ACTION_PATH: ${{ github.workspace }}
          TEND_UV_DIR: ${{ runner.temp }}/tend-uv
          UV_CACHE_DIR: ${{ runner.temp }}/tend-mitmproxy-uv
          MITMPROXY_VERSION: "0"
        run: |
          set -o pipefail
          alias="/tmp/tend-runner-home-alias-$GITHUB_RUN_ID"
          case "$alias" in
            "$HOME" | "$HOME"/*)
              echo "::error::the canonical-refusal fixture is lexically under HOME"
              exit 1
              ;;
          esac
          TEND_SANDBOX_PATH="$alias" \
            bash proxy/setup-sandbox.sh >"$RUNNER_TEMP/refused.log" 2>&1 && rc=0 || rc=$?
          # Actions parses workflow commands out of any step output, so echoing
          # the captured line verbatim would annotate this passing job with the
          # error it exists to provoke.
          sed 's/^::error::/refused: /' "$RUNNER_TEMP/refused.log"
          if [ "${rc:-0}" -eq 0 ]; then
            echo "::error::a runner-home sandbox_path entry was accepted"
            exit 1
          fi
          grep -q "::error::sandbox_path entry .* is under the runner's home" \
            "$RUNNER_TEMP/refused.log"

      - name: Restore workspace ownership for checkout cleanup
        if: always()
        run: |
          if [ -n "${SANDBOX:-}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

  # The weekly rule that governed `codex_version` asked for a confirmation
  # nothing here could produce ("bump only to a release confirmed to run under
  # `codex exec`"): no OPENAI_API_KEY reaches this repo's runs and no workflow
  # sets `harness: codex`, so the pin drifted by default rather than by
  # decision. This is the half of that confirmation which needs no credential,
  # so it can gate every bump PR.
  #
  # It covers where a silent break actually lands: `codex exec` dropping or
  # renaming a flag the action passes, and `codex plugin add` no longer
  # printing the `Installed plugin root: ` prefix the action parses with awk to
  # set CLAUDE_PLUGIN_ROOT. Either one fails every adopter's Codex run at the
  # first step. It guards the other direction too — a change to
  # .agents/plugins/marketplace.json or the plugin manifest that Codex can no
  # longer install fails here rather than in an adopter's job.
  #
  # It does not cover an agent session: model selection, sandbox behavior
  # under a live model, and whether the final message reaches
  # --output-last-message all need a real key.
  test-codex-surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # `yq -e` exits non-zero if the input is ever renamed, rather than
      # yielding "null" and failing later as an unresolvable npm version.
      - name: Smoke the pinned Codex CLI surface
        run: |
          v=$(yq -e '.inputs.codex_version.default' codex/action.yaml)
          npm install -g "@openai/codex@$v"
          codex --version

          # Every flag the action's `Run Codex` step passes. Matching on
          # `--flag <` pins the option to one that still takes a value, so a
          # release that keeps the name but drops the argument fails here.
          help=$(codex exec --help)
          for flag in --model --sandbox --output-last-message --config; do
            grep -qF -- "$flag <" <<<"$help" || {
              echo "::error::codex exec no longer accepts $flag <VALUE> in $v"
              exit 1
            }
          done

          # The action registers the marketplace from the repo root and reads
          # the install path back out of the install output.
          codex plugin marketplace add "$PWD"
          out=$(codex plugin add tend-ci-runner@tend)
          echo "$out"
          root=$(awk -F': ' '/^Installed plugin root: /{print $2}' <<<"$out")
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "::error::codex $v no longer prints a parseable 'Installed plugin root: <path>'"
            exit 1
          fi
          # Both trees skills reach for through CLAUDE_PLUGIN_ROOT. Only
          # `skills/` is declared in plugin.json, so `scripts/` materializing
          # is a packaging side effect that a release could stop honouring —
          # and every skill shelling out to ${CLAUDE_PLUGIN_ROOT}/scripts/
          # would break with the job still green.
          test -f "$root/skills/triage/SKILL.md"
          test -x "$root/scripts/list-recent-runs.sh"

          # `model_reasoning_effort` is passed as a `-c` override, so a rename
          # would be silently ignored rather than rejected — `--help` can't see
          # it. `--strict-config` does validate `-c` keys, and both probes stop
          # at the trusted-directory check before any network call, so this
          # stays offline and fast. Run from a non-repo dir to hit that check.
          probedir=$(mktemp -d)
          probe() { (cd "$probedir" && codex exec --strict-config -c "$1" x </dev/null 2>&1); }
          # Negative control: if this stops erroring, --strict-config no longer
          # validates -c keys and the positive check below proves nothing.
          if ! probe 'model_reasoning_effortZZZ="low"' | grep -q 'unknown configuration field'; then
            echo "::error::codex $v no longer rejects unknown -c keys under --strict-config; the check below is void"
            exit 1
          fi
          if probe 'model_reasoning_effort="low"' | grep -q 'unknown configuration field'; then
            echo "::error::codex $v no longer accepts the model_reasoning_effort config key"
            exit 1
          fi

  # Node 22 to match worker-deploy.yaml, which had to move off 20 because
  # Wrangler refuses to run there ("Wrangler requires at least Node.js
  # v22.0.0"). That deploy job re-runs this job's typecheck and tests before
  # shipping, so leaving the gate on a version the worker's own toolchain
  # rejects makes the pre-merge signal weaker than the thing it gates.
  test-worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: pre-commit/action@v3.0.1
