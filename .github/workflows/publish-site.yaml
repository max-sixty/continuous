name: publish-site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/publish-site.yaml'
  # The same build on the PR, so a change that breaks it — an astro major, a
  # bad lockfile — fails before merge rather than on the way to Pages. Only
  # `build-site` runs there; publishing stays with push and dispatch.
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/publish-site.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: 🪴 Build site
        run: npm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist/
          retention-days: 1

  deploy-site:
    needs: build-site
    runs-on: ubuntu-24.04

    # A PR run is a build check, and a fork has no Pages to publish to.
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'max-sixty' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
