name: Tend review preflight
description: Skip a review agent when the live pull request state is already covered

inputs:
  github_token:
    description: GitHub token for reading the pull request and the bot's reviews
    required: true
  pr_number:
    description: Pull request number
    required: true

outputs:
  should_run:
    description: Whether the review agent should run
    value: ${{ steps.preflight.outputs.should_run }}
  reason:
    description: Why the review agent should run or skip
    value: ${{ steps.preflight.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Reconcile review state
      id: preflight
      shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASH_ENV: ""
        BASHOPTS: ""
        SHELLOPTS: ""
        PS4: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set +x
        PATH=/usr/sbin:/usr/bin:/sbin:/bin
        export PATH

        output=$(
          /usr/bin/python3 -E -s \
            "$ACTION_PATH/../../plugins/tend-ci-runner/scripts/review_preflight.py" \
            gate "$PR_NUMBER"
        )
        case "$output" in
          $'should_run=false\nreason=closed' | \
          $'should_run=false\nreason=covered' | \
          $'should_run=true\nreason=uncovered' | \
          $'should_run=true\nreason=readiness') ;;
          *)
            echo "review preflight returned an invalid result" >&2
            exit 1
            ;;
        esac
        printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
